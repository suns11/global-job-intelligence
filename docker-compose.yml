services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobintel}
      POSTGRES_USER: ${POSTGRES_USER:-jobintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobintel} -d ${POSTGRES_DB:-jobintel}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://jobintel:change-this-local-password@db:5432/jobintel}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py makemigrations intelligence --noinput && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
